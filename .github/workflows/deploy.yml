name: Deploy S Printer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          touch _site/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Protect scripts (compact + obfuscate the published copies)
        run: |
          npm install --no-save --no-audit --no-fund javascript-obfuscator@4 >/dev/null
          node .github/build/protect.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
