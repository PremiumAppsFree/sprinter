*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 'SP Inter',Inter,system-ui,-apple-system,'Segoe UI',sans-serif}

.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .sp-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font:700 clamp(34px,5vw,54px)/1.05 'SP Lexend',sans-serif;letter-spacing:-.02em;margin:0 0 16px}

.search input{flex:1;border:0;background:transparent;font:inherit;padding:13px 0;outline:none;color:var(--ink)}
.search svg{flex-shrink:0;color:var(--muted)}
/* the memorable bit: a sheet with crop marks */
.sheet{position:relative;justify-self:center;width:min(300px,80%);aspect-ratio:210/297;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(27,35,48,.12);padding:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:8px;transform:rotate(-2deg)}
.sheet::before,.sheet::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--ink)}
.sheet::before{top:-12px;left:-12px;border-right:0;border-bottom:0}
.sheet::after{bottom:-12px;right:-12px;border-left:0;border-top:0}
.sheet i{display:block;aspect-ratio:35/45;border-radius:3px;background:linear-gradient(180deg,#cfe9f6 0 52%,#9fb3c8 52%);position:relative;overflow:hidden}
.sheet i::after{content:"";position:absolute;left:30%;top:18%;width:40%;height:38%;border-radius:50%;background:#e9c8ad}
.sheet .bar{grid-column:1/-1;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--c) 0 25%,var(--m) 25% 50%,var(--y) 50% 75%,var(--ink) 75%);margin-top:6px}
.sheet .ln{grid-column:1/-1;height:6px;border-radius:3px;background:var(--desk)}
.sheet .ln.s{width:60%}
main.sp-wrap{padding-top:40px}
section.group{margin-bottom:44px}
.group h2{font:700 22px/1.2 'SP Lexend',sans-serif;margin:0 0 4px}
.group .lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tool{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;transition:border-color .15s}
.tool:hover,.tool:focus-visible{border-color:var(--c);outline:none}
.tool:focus-visible{box-shadow:0 0 0 3px rgba(0,152,216,.2)}
.tool img{width:42px;height:42px;object-fit:contain;flex-shrink:0}
.tool b{display:block;font-weight:650;font-size:15.5px;color:var(--ink)}
.tool span{display:block;color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px}
.empty{display:none;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--ink2)}
.note{display:flex;gap:12px;align-items:flex-start;background:#fff;border-left:4px solid var(--c);border-radius:8px;padding:14px 16px;color:var(--ink2);font-size:14.5px;margin-bottom:44px}
@media (max-width:820px){.hero .sp-wrap{grid-template-columns:1fr;padding-top:34px;padding-bottom:34px}.sheet{display:none}.hero p{font-size:16.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
